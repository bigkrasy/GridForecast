services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-gridforecast}:latest
    container_name: ${COMPOSE_PROJECT_NAME:-gridforecast}-api
    ports:
      - "${API_PORT:-9001}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - IN_DOCKER=1
      - MODELS_DIR=/app/models
      - DATA_DIR=/app/data
      - LOGS_DIR=/app/logs
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data:ro
    restart: unless-stopped
    networks:
      - gridforecast-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    image: ${COMPOSE_PROJECT_NAME:-gridforecast}:latest
    container_name: ${COMPOSE_PROJECT_NAME:-gridforecast}-dashboard
    command: >
      streamlit run src/gridforecast/api/dashboard.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
    ports:
      - "${DASHBOARD_PORT:-9004}:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://api:8000
      - MODELS_DIR=/app/models
      - DATA_DIR=/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gridforecast-net

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: ${COMPOSE_PROJECT_NAME:-gridforecast}-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9002}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - gridforecast-net
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.5.0
    container_name: ${COMPOSE_PROJECT_NAME:-gridforecast}-grafana
    ports:
      - "${GRAFANA_PORT:-9003}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_DISABLE_SIGNOUT_MENU=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT:-9003}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - gridforecast-net
    depends_on:
      - prometheus

networks:
  gridforecast-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data: